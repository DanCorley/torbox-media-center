name: docker-build
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Publish to the GHCR namespace of the repository running this workflow.
          # In a fork this resolves to ghcr.io/<fork-owner>/<fork-repo>; in the
          # upstream repository it resolves to ghcr.io/torbox-app/torbox-media-center.
          # No hard-coded upstream or personal image names.
          images: |
            ghcr.io/${{ github.repository }}
          # Optional Docker Hub publishing. Uncomment BOTH the image line below
          # and the "Login to Docker Hub" step, and set DOCKERHUB_USERNAME /
          # DOCKERHUB_TOKEN in the repository secrets.
          #   anonymoussystems/torbox-media-center
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Optional: enable only if you also uncommented the Docker Hub image above.
      # - name: Login to Docker Hub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            platforms: linux/amd64,linux/arm64,linux/arm/v8,linux/arm/v7
